version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # requirements/*.txt are generated together from uv.lock and QA inputs.
  # Updating those exports independently can create incompatible dependency graphs.
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tools/gltf-validator"
    schedule:
      interval: "weekly"
