# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,server]"
      - run: ruff check .
      - run: pytest
  numpy-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,server]" "numpy<2"
      - run: pytest
  playground-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/make_synthetic.py --out .cache/syn --dataset stepped
      - name: Test playground against the real server
        shell: bash
        run: |
          python -m atap serve --work-dir .cache/jobs >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 0.25
          done
          python tools/e2e_playground.py --data .cache/syn/stepped --url http://127.0.0.1:8000/
