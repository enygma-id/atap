# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements/ci.txt -r requirements/build.txt
      - name: Install the checked-out project without dependency downloads
        shell: bash
        run: |
          python -m build --wheel --no-isolation --outdir .cache/ci-wheel
          python -m pip install --no-deps .cache/ci-wheel/*.whl
      - run: ruff check .
      - run: pytest --basetemp "${{ runner.temp }}/atap-pytest"
      - name: Retain golden diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failure-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/atap-pytest/release-goldens*/*.geojson
            ${{ runner.temp }}/atap-pytest/release-goldens*/*.json
          if-no-files-found: warn
  numpy-1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/numpy1.txt -r requirements/build.txt
      - name: Install the checked-out project without dependency downloads
        shell: bash
        run: |
          python -m build --wheel --no-isolation --outdir .cache/ci-wheel
          python -m pip install --no-deps .cache/ci-wheel/*.whl
      - run: pytest --basetemp "${{ runner.temp }}/atap-pytest"
      - name: Retain golden diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failure-numpy-1
          path: |
            ${{ runner.temp }}/atap-pytest/release-goldens*/*.geojson
            ${{ runner.temp }}/atap-pytest/release-goldens*/*.json
          if-no-files-found: warn
  playground-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements/ci.txt -r requirements/build.txt
      - name: Install the checked-out project without dependency downloads
        shell: bash
        run: |
          python -m build --wheel --no-isolation --outdir .cache/ci-wheel
          python -m pip install --no-deps .cache/ci-wheel/*.whl
      - run: python -m playwright install --with-deps chromium
      - run: python tools/make_synthetic.py --out .cache/syn
      - name: Test playground against the real server
        shell: bash
        run: |
          python -m atap serve --work-dir .cache/jobs >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 0.25
          done
          python tools/e2e_playground.py --data .cache/syn/stepped --url http://127.0.0.1:8000/
          python tools/e2e_playground.py --data .cache/syn/stepped --url http://127.0.0.1:8000/ --offline

  uv-workflow:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - run: uv sync --extra dev --locked
      - run: uv run python -c "import atap; print(atap.__version__)"

  release-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - run: uv sync --extra dev --locked --python 3.12
      - name: Verify release metadata, sample manifests and CFF 1.2.0 schema
        run: uv run python tools/check_release_readiness.py --out .cache/release-readiness
      - name: Retain technical readiness evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-${{ github.sha }}
          path: |
            .cache/release-readiness/
            !.cache/release-readiness/cff-env/**
          if-no-files-found: error

  export-conformance:
    name: export-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false
      - name: Create evidence directory
        run: mkdir -p .cache/release-evidence/setup
      - name: Install pinned QA dependencies outside the engine dependency set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/build.txt
          uv sync --extra dev --locked --python 3.12
          uv pip install --python .venv/bin/python --require-hashes -r tools/requirements-export-validation.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libcgal-dev libeigen3-dev libboost-filesystem-dev libgeos++-dev libssl-dev libxml2-utils
          rustup toolchain install 1.90.0 --profile minimal
      - name: Install integrity-locked GLB validator
        working-directory: tools/gltf-validator
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build official pinned validators
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 install --git https://github.com/cityjson/cjval.git --rev 40db6dd698cfe9de5a88a4a1aac4a5173095d86f --locked --features build-binary 2>&1 | tee .cache/release-evidence/setup/cjval-build.log
          git clone --depth 1 --branch 2.7.0 https://github.com/tudelft3d/val3dity.git .cache/val3dity-source
          test "$(git -C .cache/val3dity-source rev-parse HEAD)" = fbe9e4d65376e1c3f63401f15967485783f78c0a
          cmake -S .cache/val3dity-source -B .cache/val3dity-build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee .cache/release-evidence/setup/val3dity-configure.log
          cmake --build .cache/val3dity-build --parallel 2 2>&1 | tee .cache/release-evidence/setup/val3dity-build.log
          sha256sum "$(command -v cjval)" .cache/val3dity-build/val3dity tools/gltf-validator/package-lock.json > .cache/release-evidence/setup/tool-hashes.txt
      - name: Prepare complete hash-verified schemas and generate actual outputs
        run: |
          .venv/bin/python tools/prepare_export_validation.py --cache .cache/export-validation-schemas
          .venv/bin/python tools/make_export_fixtures.py --out .cache/release-evidence/fixtures
      - name: Validate standards, independent readers, real solids and final hashes
        run: |
          .venv/bin/python tools/validate_exports.py --fixtures .cache/release-evidence/fixtures --out .cache/release-evidence/conformance --schema-cache .cache/export-validation-schemas --cjval /home/runner/.cargo/bin/cjval --val3dity .cache/val3dity-build/val3dity --gltf-module "${{ github.workspace }}/tools/gltf-validator/node_modules/gltf-validator"
      - name: Prove negative cases fail and missing validators never pass
        env:
          ATAP_CONFORMANCE: '1'
          ATAP_EXPORT_FIXTURES: .cache/release-evidence/fixtures
          ATAP_SCHEMA_CACHE: .cache/export-validation-schemas
          CJVAL: /home/runner/.cargo/bin/cjval
          VAL3DITY: .cache/val3dity-build/val3dity
        run: .venv/bin/python -m pytest tests/test_external_export_validation.py -q --junitxml=.cache/release-evidence/external-tests.xml
      - name: Build distributions and verify a fresh wheel install
        run: |
          uv build --python "$(command -v python)" --no-build-isolation --out-dir .cache/release-evidence/dist
          .venv/bin/python tools/smoke_export_distribution.py --dist .cache/release-evidence/dist --sample .cache/release-evidence/fixtures/simple/result.geojson --out .cache/release-evidence/distribution
      - name: Retain immutable validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-conformance-${{ github.sha }}
          path: |
            .cache/release-evidence/
            !.cache/release-evidence/**/venv/**
          if-no-files-found: error
