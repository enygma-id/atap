[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atap"
version = "0.2.0"
description = "Terrain-aware architectural polygonization from footprints, DSM, and DTM"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.5",
]

[project.optional-dependencies]
formats = ["geopandas>=0.14"]
server = ["fastapi", "uvicorn", "python-multipart"]
dev = ["pytest", "pytest-cov", "ruff", "playwright", "httpx"]

[project.scripts]
atap = "atap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atap"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
